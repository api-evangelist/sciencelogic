    breaking: false
    url: https://docs.sciencelogic.com/skylar_compliance/latest/Content/Release_Notes/Skylar_Compliance_MR/skylar_compliance_release_notes_2026.htm
    highlights:
      - Fixed violations for policies removed from a device still appearing in Latest reports (Case 00691087)
      - Backup export from the UI can now use the inferred file type or the extension defined in the plugin file (Case 00698389)
      - Fixed a "Forbidden" error on the Device Table when domain filters were applied by users with specific permissions; the domain public endpoint was updated to include a missing ID parameter (Case 00699831)
      - Fixed "Push Device Backup" alerts not being sent correctly
    api_affecting: true
    api_note: The domain public endpoint gained a missing ID parameter — a contract-visible change.
