openapi: 3.2.0
info:
  title: Skylar Compliance Firmware API
  x-logo:
    url: data:image/png;base64,
    backgroundColor: '#1565c0'
    altText: Skylar Compliance
  version: '2.0'
  description: For any queries or issues, please use the ScienceLogic Portal.
servers:
- url: /api/v2
security:
- Cookie: []
- Token: []
tags:
- name: Firmware
  description: 'Skylar Compliance can act as a repository for device firmware/software, allowing you to upload files like firmware

    images and ISO images to the appliance. Software images can also be pushed to supported devices.'
paths:
  /firmware:
    get:
      summary: List all firmware
      tags:
      - Firmware
      security:
      - Cookie: []
      - Token: []
      - Permissions:
        - ViewFirmware
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  offset:
                    description: The number of items skipped
                    type: integer
                    minimum: 0
                    default: 0
                  limit:
                    description: The numbers of items returned
                    type: integer
                    minimum: 1
                    default: 50
                  total:
                    description: The total number of items
                    type: integer
                  search:
                    description: The search parameters used to filter items
                    type: object
                    properties:
                      fulltext:
                        description: Returned items match the search term
                        type: string
                        example: some text
                      uploaded_after:
                        description: Returned items are filtered by minimum uploaded date
                        type: string
                        example: '2020-01-02T15:04:05.999Z'
                      uploaded_before:
                        description: Returned items are filtered by minimum uploaded date
                        type: string
                        example: '2023-01-02T15:04:05.999Z'
                  sort:
                    description: The sorting parameters used to sort items
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          description: Name of the field used to sort items
                          type: string
                        order:
                          description: Sorting order used to sort items
                          type: string
                          enum:
                          - asc
                          - desc
                  data:
                    description: The returned items
                    type: array
                    items:
                      $ref: '#/paths/~1firmware~1%7Bid%7D/put/requestBody/content/application~1json/schema'
                required:
                - limit
                - offset
      operationId: list_firmwares
      description: Retrieve all firmware metadata
      parameters:
      - $ref: '#/paths/~1devices~1%7Bid%7D~1backups~1%7Bbackup_id%7D~1config/parameters/0'
      - $ref: '#/paths/~1devices~1%7Bid%7D~1monitors/parameters/2'
      - $ref: '#/paths/~1jobs/get/parameters/3'
      - in: query
        name: uploaded_after
        schema:
          type: string
          example: '2020-01-02T15:04:05.999Z'
        description: Timestamp (UTC) to include results after the uploaded date.
      - in: query
        name: uploaded_before
        schema:
          type: string
          example: '2023-01-02T15:04:05.999Z'
        description: Timestamp (UTC) to include results before the uploaded date.
    post:
      summary: Upload firmware
      tags:
      - Firmware
      security:
      - Cookie: []
      - Token: []
      - Permissions:
        - ModifyFirmware
      operationId: upload_firmware
      description: Upload a firmware image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                PluginKey:
                  type: string
                  description: 'Key of the [Plugin](#tag/Plugin) that corresponds to the device type of the firmware being uploaded

                    '
                  example: cisco_ios
                Description:
                  type: string
                  description: A description of or notes aboue the firmware being uploaded
                File:
                  type: string
                  description: The actual file
                  format: binary
              required:
              - File
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/paths/~1firmware~1%7Bid%7D/put/requestBody/content/application~1json/schema'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/paths/~1jobs/get/responses/401/content/application~1json/schema'
              example:
                message: Input validation failed
                errors:
                  PluginKey:
                  - Plugin 'foo' does not exist
                  Filename:
                  - Must not be blank
      parameters: []
  /firmware/{id}:
    parameters:
    - schema:
        type: integer
      name: id
      description: Firmware ID
      in: path
      required: true
    get:
      summary: Get firmware metadata
      tags:
      - Firmware
      security:
      - Cookie: []
      - Token: []
      - Permissions:
        - ViewFirmware
      operationId: get_firmware
      description: Get metadata for a firmware image
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/paths/~1firmware~1%7Bid%7D/put/requestBody/content/application~1json/schema'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/paths/~1jobs/get/responses/401/content/application~1json/schema'
              example:
                message: Firmware does not exist
                errors:
                  ID:
                  - Firmware with ID 123 does not exist
    put:
      summary: Update firmware metadata
      tags:
      - Firmware
      security:
      - Cookie: []
      - Token: []
      - Permissions:
        - ModifyFirmware
      operationId: update_firmware
      description: Update metadata for a firmware image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Firmware
              type: object
              description: Firmware model
              properties:
                ID:
                  description: Firmware ID
                  type: integer
                  example: 123
                  readOnly: true
                Description:
                  type: string
                  description: A description of or notes aboue the firmware being uploaded
                  example: Catalyst 6500 Series / 7600 Series ASA Services Module
                PluginKey:
                  type: string
                  description: 'A [Plugin](#tag/Plugin) identifier for the device type that this firmware is restricted to. If left blank, an

                    image can be appliad to _any_ device which can have unintended side effects

                    '
                  example: cisco_ios
                PluginName:
                  type: string
                  description: User friendly name of the plugin this firmware image is restricted to
                  example: Cisco IOS
                  readOnly: true
                Filename:
                  type: string
                  description: Filename of the uploaded file
                  example: fwsm_migration_mac-1.0.18.zip
                Size:
                  type: integer
                  description: Size of the firmware in bytes
                  example: 1024
                  readOnly: true
                Uploaded:
                  type: string
                  description: Timestamp in [RFC3339](https://tools.ietf.org/html/rfc3339) format when the firmware was uploaded
                  example: '2222-02-22T22:22:22.000Z'
                  readOnly: true
                MD5:
                  type: string
                  description: MD5 hash of the uploaded file
                  example: 9cad0367c675eb1473fa492f05c0b718
                  readOnly: true
              required:
              - Filename
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/paths/~1firmware~1%7Bid%7D/put/requestBody/content/application~1json/schema'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/paths/~1jobs/get/responses/401/content/application~1json/schema'
              example:
                $ref: '#/paths/~1firmware/post/responses/400/content/application~1json/example'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/paths/~1jobs/get/responses/401/content/application~1json/schema'
              example:
                $ref: '#/paths/~1firmware~1%7Bid%7D/get/responses/404/content/application~1json/example'
    delete:
      summary: Delete a firmware
      tags:
      - Firmware
      security:
      - Cookie: []
      - Token: []
      - Permissions:
        - ModifyFirmware
      operationId: delete_firmware
      responses:
        '204':
          description: Firmware deleted
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/paths/~1jobs/get/responses/401/content/application~1json/schema'
              example:
                $ref: '#/paths/~1firmware~1%7Bid%7D/get/responses/404/content/application~1json/example'
  /firmware/{id}/push:
    parameters:
    - schema:
        type: integer
      name: id
      description: Firmware ID
      in: path
      required: true
    post:
      summary: Push firmware to devices
      tags:
      - Firmware
      security:
      - Cookie: []
      - Token: []
      - Permissions:
        - PushFirmware
      operationId: push_firmware
      description: 'Push firmware to one or more devices. A device plugin needs to expose an `upgrade` function

        to support pushing firmware updates.


        **Note:** Skylar Compliance allows you to push firmware that is not restricted to a plugin/device type to ALL devices.

        This can have unintended consequences.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                DeviceIDs:
                  type: array
                  description: 'A list of [Device](#tag/Device) IDs to push this firmware to.

                    '
                  items:
                    type: integer
                    example: 123
                  example:
                  - 1
                  - 2
                  - 3
              required:
              - DeviceIDs
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/paths/~1jobs/get/responses/401/content/application~1json/schema'
              example:
                message: Input validation failed
                errors:
                  DeviceIDs:
                  - Must not be blank
                  DeviceIDs[0]:
                  - Device with ID 123 does not exist
  /firmware/export:
    post:
      summary: Export firmware
      tags:
      - Firmware
      security:
      - Cookie: []
      - Token: []
      - Permissions:
        - PushFirmware
      operationId: export_firmware
      description: 'Export one or more firmware images.


        When `Method` is `download`, use each returned `DownloadFiles[].DownloadID`

        with `GET /downloads/{id}` to retrieve the exported file.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                FirmwareIDs:
                  type: array
                  description: List of Firmware IDs to export
                  items:
                    type: integer
                  example:
                  - 1
                  - 2
                  - 3
                Method:
                  type: string
                  description: 'Delivery method of how to transfer the firmware to the requestor.

                    '
                  enum:
                  - download
                  - email
                  - server
                  default: download
                EmailAddress:
                  type: string
                  description: Email address that an exported firmware will be sent to. Requires `Method` to be set to "email"
                  example: afox@skylarcompliance.com
                FileServerID:
                  type: integer
                  description: ID of a [Fileserver](#tag/Fileserver) to use for the export
                  example: 123
              required:
              - FirmwareIDs
            examples:
              Download:
                value:
                  FirmwareIDs:
                  - 1
                  Method: download
              Email:
                value:
                  FirmwareIDs:
                  - 2
                  Method: email
                  EmailAddress: afox@skylarcompliance.com
              Fileserver:
                value:
                  FirmwareIDs:
                  - 3
                  Method: server
                  FileServerID: 123
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: FirmwareExport
                type: object
                properties:
                  FirmwareIDs:
                    type: array
                    description: List of exported Firmware IDs
                    items:
                      type: integer
                    example:
                    - 1
                    - 2
                    - 3
                  DownloadFiles:
                    type: array
                    description: 'Details for firmware files to download.

                      When `Method` is `download`, call `GET /downloads/{id}` for each `DownloadID`.

                      '
                    items:
                      type: object
                      description: Details for firmware file to download
                      properties:
                        FirmwareID:
                          type: integer
                          example: 1
                          description: ID of the firwmare
                        Filename:
                          type: string
                          example: firmware.bin
                          description: Filename of the firmware file
                        DownloadID:
                          type: string
                          example: 90404db7-a6a4-4601-b1fa-9e7df327b984
                          description: ID used with `GET /downloads/{id}` to download this exported file
                      required:
                      - FirmwareID
                      - Filename
                      - DownloadID
                  EmailAddress:
                    type: string
                    description: Email address that an exported firmware was sent to if `Method` was set to "email"
                    example: afox@skylarcompliance.com
                  FileServerID:
                    type: integer
                    description: ID of a [Fileserver](#tag/Fileserver) that was used for exporting
                    example: 123
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/paths/~1jobs/get/responses/401/content/application~1json/schema'
              example:
                errors:
                  FirmwareIDs:
                  - Must not be blank
                  FirmwareIDs[0]:
                  - Firmware with ID 123 does not exist
                  Method:
                  - Must be one of 'download', 'email' or 'server'
                  EmailAddress:
                  - Can not be empty if Method is 'email'
                  - Is not a valid email address
                  FileServerID:
                  - Can not be empty if Method is 'server'
                  - Fileserver with ID 123 does not exist
components:
  securitySchemes:
    Cookie:
      description: 'The Skylar Compliance web interface uses session cookies to authenticate API requests coming from a user''s browser.

        Please use authentication tokens when integrating with the Skylar Compliance API programmatically.


        Example header:


        ```http

        Cookie: session=abcde12345; Path=/; HttpOnly

        ```

        '
      type: apiKey
      in: cookie
      name: session
    Token:
      description: 'To integrate with the Skylar Compliance API, please use the web interface to create API tokens. API requests via

        token should pass an `Authorization` header using the `Custom` prefix.


        Example header:


        ```http

        Authorization: Custom qVUXmMhPsle3NVU...

        ```

        '
      type: apiKey
      in: header
      name: Authorization
    Permissions:
      description: 'Lists required [Permissions](#tag/Permission) for each individual endpoint.


        **Please note:** Whilst this authentication method is listed as an OpenID Connect authentication type, it

        is only used for the purposes of displaying the required permissions on each endpoint and is _not_ a valid

        authentication method by itself.


        - `ModifyDevice`

        - `BackupDevice`

        - `RestoreDevice`

        - `CommandDevice`

        - `ViewDeviceauth`

        - `ViewDevices`

        - `ListBackups`

        - `ViewBackup`

        - `ExportBackup`

        - `ModifyBackup`

        - `ViewLogs`

        - `ViewSyslogs`

        - `ViewSysadmin`

        - `UpdateSysadmin`

        - `ModifyUser`

        - `ViewUsers`

        - `ViewUserauth`

        - `ViewRoles`

        - `EditRoles`

        - `ModifyDiscovery`

        - `ListTemplates`

        - `ViewTemplate`

        - `ModifyTemplate`

        - `PushTemplate`

        - `ViewFirmware`

        - `ModifyFirmware`

        - `PushFirmware`

        - `ViewCredentials`

        - `ModifyCredentials`

        - `ModifyAssets`

        - `ViewAssets`

        - `ViewDomain`

        - `ModifyDomain`

        - `ViewDevicePolicy`

        - `ModifyDevicePolicy`

        - `ApplyDevicePolicy`

        - `ViewPassrules`

        - `ModifyPassrules`

        - `ViewRadius`

        - `ModifyRadius`

        - `ViewReports`

        - `ModifyReports`

        - `ArchivePlatform`

        - `ViewBackupSchedule`

        - `ModifyBackupSchedule`

        - `ViewLegacyReportAssets`

        - `ViewLegacyReportCompliance`

        - `ViewLegacyReportAdmin`

        - `ViewLegacyReportConfig`

        - `ViewLegacyReportBackups`

        - `ViewLegacyReportDashboard`

        - `ViewLegacyReportMonitor`

        - `AddDevice`

        - `DeleteDevice`

        - `ExportDevices`

        - `ExportUsers`

        - `ModifyLabels`

        - `ModifyTokens`

        - `OpenTerminal`

        - `ViewAllSchedules`

        - `ModifyAllSchedules`

        - `ViewDeviceCommand`

        - `ModifyDeviceCommand`

        - `ViewUnredactedBackup`

        '
      type: openIdConnect
      openIdConnectUrl: https://ignore.example.com
