openapi: 3.2.0
info:
  title: Skylar Compliance Device API
  x-logo:
    url: data:image/png;base64,
    backgroundColor: '#1565c0'
    altText: Skylar Compliance
  version: '2.0'
  description: For any queries or issues, please use the ScienceLogic Portal.
servers:
- url: /api/v2
security:
- Cookie: []
- Token: []
tags:
- name: Device
  description: Devices are Skylar Compliance's representation of physical or virtual network devices.
paths:
  /devices:
    get:
      summary: List devices
      tags:
      - Device
      security:
      - Cookie: []
      - Token: []
      - Permissions:
        - ViewDevices
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  fields:
                    description: The filtered fields
                    type: array
                    items:
                      type: string
                  offset:
                    description: The number of items skipped
                    type: integer
                    minimum: 0
                    default: 0
                  limit:
                    description: The numbers of items returned
                    type: integer
                    minimum: 1
                    default: 50
                  total:
                    description: The total number of items
                    type: integer
                  search:
                    description: The search parameters used to filter items
                    title: Device Search Fields
                    type: object
                    properties:
                      fulltext:
                        description: Returned items match the search term
                        type: string
                        example: some text
                      manufacturer:
                        description: List of manufacturers used to filter returned items
                        type: object
                        properties:
                          include:
                            description: Included on returned items
                            type: array
                            items:
                              type: string
                            example:
                            - Cisco
                            - BigIP
                          exclude:
                            description: Excluded from returned items
                            type: array
                            items:
                              type: string
                            example:
                            - Solarwinds
                      plugin_key:
                        description: List of plugin keys used to filter returned items
                        type: object
                        properties:
                          include:
                            description: Included on returned items
                            type: array
                            items:
                              type: string
                            example:
                            - cisco_ios
                          exclude:
                            description: Excluded from returned items
                            type: array
                            items:
                              type: string
                            example:
                            - cisco_asa
                      location:
                        description: List of locations used to filter returned items
                        type: object
                        properties:
                          include:
                            description: Included on returned items
                            type: array
                            items:
                              type: string
                            example:
                            - Comms Rack
                            - ESX Server 1
                          exclude:
                            description: Excluded from returned items
                            type: array
                            items:
                              type: string
                            example:
                            - Home Office
                      domain_id:
                        description: List of domain IDs used to filter returned items
                        type: object
                        properties:
                          include:
                            description: Included on returned items
                            type: array
                            items:
                              type: integer
                          exclude:
                            description: Excluded from returned items
                            type: array
                            items:
                              type: integer
                      backupstatusstring:
                        description: List of backup status used to filter returned items
                        type: object
                        properties:
                          include:
                            description: Included on returned items
                            type: array
                            items:
                              type: string
                            example:
                            - OK
                          exclude:
                            description: Excluded from returned items
                            type: array
                            items:
                              type: string
                            example:
                            - Failed
                      agent_id:
                        description: List of agent IDs used to filter returned items
                        type: object
                        properties:
                          include:
                            description: Included on returned items
                            type: array
                            items:
                              type: integer
                          exclude:
                            description: Excluded from returned items
                            type: array
                            items:
                              type: integer
                      protocol:
                        description: List of protocols used to filter returned items
                        type: object
                        properties:
                          include:
                            description: Included on returned items
                            type: array
                            items:
                              type: string
                            example:
                            - ssh
                            - ftp
                          exclude:
                            description: Excluded from returned items
                            type: array
                            items:
                              type: string
                            example:
                            - telnet
                      lastbackupattempt_after:
                        description: Returned items are filtered by minimum lastbackupattempt date
                        type: string
                        example: '2020-01-02T15:04:05.999Z'
                      lastbackupattempt_before:
                        description: Returned items are filtered by minimum lastbackupattempt date
                        type: string
                        example: '2023-01-02T15:04:05.999Z'
                      lastbackup_after:
                        description: Returned items are filtered by minimum lastbackup date
                        type: string
                        example: '2020-01-02T15:04:05.999Z'
                      lastbackup_before:
                        description: Returned items are filtered by minimum lastbackup date
                        type: string
                        example: '2023-01-02T15:04:05.999Z'
                      disabled:
                        description: Disabled status included on returned items
                        type: boolean
                      compliancestatus:
                        description: List of compliance status used to filter returned items
                        type: object
                        properties:
                          include:
                            description: Included on returned items
                            type: array
                            items:
                              type: string
                            example:
                            - Passed
                          exclude:
                            description: Excluded from returned items
                            type: array
                            items:
                              type: string
                            example:
                            - Failed
                      up:
                        description: Up status included on returned items
                        type: boolean
                      serial:
                        description: List of serial numbers used to filter returned items
                        type: object
                        properties:
                          include:
                            description: Included on returned items
                            type: array
                            items:
                              type: string
                            example:
                            - FCZ1047W0F9
                            - FKD1227W0F9
                          exclude:
                            description: Excluded from returned items
                            type: array
                            items:
                              type: string
                            example:
                            - FJJ13427W0D1
                      firmware:
                        description: List of firmwares used to filter returned items
                        type: object
                        properties:
                          include:
                            description: Included on returned items
                            type: array
                            items:
                              type: string
                            example:
                            - IOS 12.1(22)EA4
                            - IOS 11.4(14)EA4
                          exclude:
                            description: Excluded from returned items
                            type: array
                            items:
                              type: string
                            example:
                            - IOS 10.1(34)EA2
                      baseline:
                        description: List of baselines used to filter returned items
                        type: object
                        properties:
                          include:
                            description: Included on returned items
                            type: array
                            items:
                              type: string
                            example:
                            - 1
                          exclude:
                            description: Excluded from returned items
                            type: array
                            items:
                              type: string
                            example:
                            - 0
                      updated_after:
                        description: Returned items are filtered by minimum updated date
                        type: string
                        example: '2020-01-02T15:04:05.999Z'
                      updated_before:
                        description: Returned items are filtered by minimum updated date
                        type: string
                        example: '2023-01-02T15:04:05.999Z'
                      nextbackup_after:
                        description: Returned items are filtered by minimum nextbackup date
                        type: string
                        example: '2020-01-02T15:04:05.999Z'
                      nextbackup_before:
                        description: Returned items are filtered by minimum nextbackup date
                        type: string
                        example: '2023-01-02T15:04:05.999Z'
                      model:
                        description: List of model used to filter returned items
                        type: object
                        properties:
                          include:
                            description: Included on returned items
                            type: array
                            items:
                              type: string
                            example:
                            - WS-C2950-24
                          exclude:
                            description: Excluded from returned items
                            type: array
                            items:
                              type: string
                            example:
                            - WS-C2950-24
                      state:
                        description: List of states used to filter returned items
                        type: object
                        properties:
                          include:
                            description: Included on returned items
                            type: array
                            items:
                              type: string
                            example:
                            - Idle
                          exclude:
                            description: Excluded from returned items
                            type: array
                            items:
                              type: string
                            example:
                            - Idle
                      device_name:
                        description: List of device names used to filter returned items
                        type: object
                        properties:
                          include:
                            description: Included on returned items
                            type: array
                            items:
                              type: string
                            example:
                            - Router-1
                            - Switch-2
                          exclude:
                            description: Excluded from returned items
                            type: array
                            items:
                              type: string
                            example:
                            - Router-1
                  filter_op:
                    description: Filter operation to use
                    type: string
                    enum:
                    - and
                    - or
                    example:
                    - or
                  sort:
                    description: The sorting parameters used to sort items
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          description: Name of the field used to sort items
                          type: string
                        order:
                          description: Sorting order used to sort items
                          type: string
                          enum:
                          - asc
                          - desc
                  scoped_permissions:
                    description: 'Scoped permissions are used to filter the results by the user''s permissions on a given domain.

                      It will only return results in the domain where the user has the specified permissions.

                      '
                    type: array
                    items:
                      type: string
                    example:
                    - ViewDevices
                    - PushFirmware
                  data:
                    description: The returned items
                    type: array
                    items:
                      $ref: '#/paths/~1devices/post/requestBody/content/application~1json/schema'
                required:
                - limit
                - offset
      operationId: list_devices
      description: Retrieve all devices
      parameters:
      - $ref: '#/paths/~1jobs/get/parameters/0'
      - $ref: '#/paths/~1devices~1%7Bid%7D~1backups~1%7Bbackup_id%7D~1config/parameters/0'
      - $ref: '#/paths/~1devices~1%7Bid%7D~1monitors/parameters/2'
      - $ref: '#/paths/~1jobs/get/parameters/3'
      - in: query
        name: scoped_permission[]
        schema:
          type: array
          items:
            type: string
          example:
          - ViewDevices
          - PushFirmware
        description: 'INTERNAL ONLY. This parameter might be subjected to change.

          Array of strings that should be used filter the items based on the user permissions on a given domain.

          '
      - $ref: '#/paths/~1devices~1count/parameters/1'
      - $ref: '#/paths/~1devices~1count/parameters/2'
      - $ref: '#/paths/~1devices~1count/parameters/3'
      - $ref: '#/paths/~1devices~1count/parameters/4'
      - $ref: '#/paths/~1devices~1count/parameters/5'
      - $ref: '#/paths/~1devices~1count/parameters/6'
      - $ref: '#/paths/~1devices~1count/parameters/7'
      - $ref: '#/paths/~1devices~1count/parameters/8'
      - $ref: '#/paths/~1devices~1count/parameters/9'
      - $ref: '#/paths/~1devices~1count/parameters/10'
      - $ref: '#/paths/~1devices~1count/parameters/11'
      - $ref: '#/paths/~1devices~1count/parameters/12'
      - $ref: '#/paths/~1devices~1count/parameters/13'
      - $ref: '#/paths/~1devices~1count/parameters/14'
      - $ref: '#/paths/~1devices~1count/parameters/15'
      - $ref: '#/paths/~1devices~1count/parameters/16'
      - $ref: '#/paths/~1devices~1count/parameters/17'
      - $ref: '#/paths/~1devices~1count/parameters/18'
      - $ref: '#/paths/~1devices~1count/parameters/19'
      - $ref: '#/paths/~1devices~1count/parameters/20'
      - $ref: '#/paths/~1devices~1count/parameters/21'
      - $ref: '#/paths/~1devices~1count/parameters/22'
      - $ref: '#/paths/~1devices~1count/parameters/23'
      - $ref: '#/paths/~1devices~1count/parameters/24'
      - $ref: '#/paths/~1devices~1count/parameters/25'
      - $ref: '#/paths/~1devices~1count/parameters/26'
      - $ref: '#/paths/~1devices~1count/parameters/27'
      - $ref: '#/paths/~1devices~1count/parameters/28'
      - $ref: '#/paths/~1devices~1count/parameters/29'
      - $ref: '#/paths/~1devices~1count/parameters/30'
      - $ref: '#/paths/~1devices~1count/parameters/31'
      - $ref: '#/paths/~1devices~1count/parameters/32'
      - $ref: '#/paths/~1devices~1count/parameters/33'
      - $ref: '#/paths/~1devices~1count/parameters/34'
      - $ref: '#/paths/~1devices~1count/parameters/35'
      - $ref: '#/paths/~1devices~1count/parameters/36'
      - $ref: '#/paths/~1devices~1count/parameters/37'
      - $ref: '#/paths/~1devices~1count/parameters/38'
      - $ref: '#/paths/~1devices~1count/parameters/39'
      - $ref: '#/paths/~1devices~1count/parameters/40'
      - $ref: '#/paths/~1devices~1count/parameters/41'
      - $ref: '#/paths/~1devices~1count/parameters/42'
      - in: query
        name: base_domain_id[]
        schema:
          type: array
          items:
            type: integer
        description: INTERNAL USE ONLY. List of domain IDs to include in the results. This parameter enforces the domain over the regular filters.
      - in: query
        name: base_plugin_key[]
        schema:
          type: array
          items:
            type: string
        description: INTERNAL USE ONLY.  List of keys to include in the results. This parameter enforces the plugin over the regular filters.
      - in: query
        name: device_name[]
        schema:
          type: array
          items:
            type: string
        description: List of device names to include in the results
        example:
        - Router-1
        - Switch-2
      - in: query
        name: not[device_name][]
        schema:
          type: array
          items:
            type: string
        description: List of device names to exclude from the results
        example:
        - Router-1
      - in: query
        name: id[]
        schema:
          type: array
          items:
            type: integer
        description: List of IDs to include in the results
    post:
      summary: Create a device
      tags:
      - Device
      security:
      - Cookie: []
      - Token: []
      - Permissions:
        - AddDevice
      operationId: create_device
      description: Create a new device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Device
              type: object
              description: Device model
              properties:
                ID:
                  description: Device ID
                  type: integer
                  example: 123
                  readOnly: true
                Name:
                  description: Device name
                  type: string
                  example: Demo device
                DomainID:
                  type: integer
                  description: ID of the [Domain](#tag/Domain) a device belongs to (if any). Defaults to 0 if no domain is set
                  default: 0
                  example: 123
                DomainName:
                  type: string
                  readOnly: true
                  description: Name of the [Domain](#tag/Domain) a device belongs to. Defaults to "Global" if no domain is set
                  default: Global
                LabelIDs:
                  writeOnly: true
                  type: array
                  description: A list of [Label](#tag/Label) IDs attached to this device
                  items:
                    type: integer
                  example:
                  - 1
                  - 2
                  - 3
                Labels:
                  description: A list of [Label](#tag/Label) attached to this device
                  readOnly: true
                  type: array
                  items:
                    type: object
                    $ref: '#/paths/~1labels/post/requestBody/content/application~1json/schema'
                Disabled:
                  type: boolean
                  description: Disable or enable a device
                  default: false
                  example: true
                DisabledUntil:
                  type: string
                  description: 'Timestamp of when to re-enable a device if it is disabled. Pass an empty string `""` to disable a device forever.

                    '
                  example: '2021-01-18T23:59:59.999Z'
                DisabledReason:
                  type: string
                  description: Reason for disabling a device
                Monitor:
                  type: object
                  description: Define device monitoring settings
                  properties:
                    Enabled:
                      type: boolean
                      description: Enable or disable device monitoring
                      default: false
                      example: true
                    AlertFail:
                      type: integer
                      description: Regard as down after this many failures
                      example: 2
                    IsPing:
                      type: boolean
                      description: Perform ICMP ping rather than TCP connect
                      example: true
                      default: false
                    AlertEmail:
                      type: boolean
                      description: Send alert email to owner after AlertFail failures
                      example: false
                      default: false
                    AlertEmailUp:
                      type: boolean
                      example: true
                      description: Send alert email to owner when device is back up
                      default: false
                AssetFields:
                  type: array
                  description: 'List of [Assetfields](#tag/SettingsAssetField) with device specific data

                    '
                  items:
                    type: object
                    properties:
                      ID:
                        type: integer
                        description: Internal [Assetfield](#tag/SettingsAssetField) ID
                        example: 123
                      Name:
                        type: string
                        description: Asset field name
                        example: Location
                        readOnly: true
                      Type:
                        type: string
                        description: Asset field type
                        example: text
                        readOnly: true
                      Value:
                        type: string
                        description: Asset field value
                        example: Example Location
                    required:
                    - ID
                    - Value
                AdditionalInformation:
                  type: object
                  description: 'List of additional information values originating either from device''s plugin (e.g. interfaces, static routes, version, location) or info commands.

                    '
                  properties:
                    PluginCommands:
                      type: array
                      readOnly: true
                      description: List of additional information values originating from device's plugin commands.
                      items:
                        type: object
                        readOnly: true
                        properties:
                          Name:
                            type: string
                            readOnly: true
                            description: Name of the plugin info type.
                            example: Static Routes
                          Value:
                            type: string
                            readOnly: true
                            description: Value of the plugin info type function output.
                            example: 'Default gateway: 172.16.21.254'
                    InfoCommands:
                      type: array
                      description: List of additional information values originating from device's info commands. Writable only on update.
                      items:
                        type: object
                        properties:
                          ID:
                            type: integer
                            description: Info command's ID.
                            example: 1
                          Value:
                            type: string
                            readOnly: true
                            description: Value of the info command output.
                            example: uptime is 2 weeks, 1 day, 22 hours, 51 minutes
                PluginKey:
                  type: string
                  description: A [Plugin](#tag/Plugin) identifier (`key`) that sets the plugin a device uses
                  example: cisco_ios
                PluginName:
                  type: string
                  description: User friendly name of the plugin this device uses
                  example: Cisco IOS
                  readOnly: true
                PluginFields:
                  $ref: '#/paths/~1devices~1test/post/requestBody/content/application~1json/schema/properties/PluginFields'
                PublicKey:
                  type: string
                  description: Device SSH public key used by a device to communicate with Skylar Compliance when `PluginKey` is `push_device` and `Protocol` is `sftp`
                  example: ssh-rsa AAAAB3N...
                NotificationEmails:
                  type: array
                  description: Email addresses for notifications. Defaults to the email address of the user creating a device.
                  items:
                    type: string
                  example:
                  - afox@skylarcompliance.com
                  - asilva@skylarcompliance.com
                Notifications:
                  type: object
                  description: Triggers for sending notification emails to the device owner
                  properties:
                    OnConfigChange:
                      type: boolean
                      description: Send notification if a configuration change has been detected (compares current with previous backup)
                      example: true
                      default: false
                    OnBackupStart:
                      type: boolean
                      description: Notify when a scheduled backup starts
                      example: false
                      default: false
                    OnBackupEnd:
                      type: boolean
                      description: Notify when a scheduled backup finishes
                      example: false
                      default: false
                    SyslogTrigger:
                      type: boolean
                      description: 'Enables real-time change detection if this device supports it. **Please note:** In order to use this feature,

                        you must configure the device to send its logs to Skylar Compliance using syslog.

                        '
                      example: false
                      default: false
                    SuppressDuplicatedEmail:
                      type: boolean
                      default: false
                      description: 'In combination with `OnConfigChange` and `SyslogTrigger` being `true`, this setting supresses duplicate emails.

                        '
                      example: false
                    LogTranscript:
                      type: boolean
                      default: false
                      description: 'Select this option to keep a full transcript log for this device for debugging purposes. A transcript log is

                        automatically saved if the backup fails, so this is rarely needed.

                        '
                    FullTranscript:
                      type: boolean
                      default: false
                      description: 'When enabled, device transcripts will not be truncated if they surpass the size limit.

                        '
                      example: false
                BackupSchedules:
                  description: 'Please note: Backup schedules inherit defaults from the [/settings/device](#tag/SettingsDevice) endpoint.

                    '
                  type: array
                  items:
                    type: object
                    properties:
                      Schedule:
                        type: string
                        description: A [cron-like expression](#section/Schedules)
                        example: 15 * * * *
                      RetainVersions:
                        type: integer
                        description: How many different versions of backups to keep (`0` for unlimited)
                        example: 5
                        default: 0
                      RetainDays:
                        type: integer
                        description: How many days to retain backups
                        example: 5
                        default: 0
                      DeleteDays:
                        type: integer
                        description: How many days until backups are deleted.
                        example: 5
                        default: 0
                      ConfigTypes:
                        type: array
                        description: Config types to backup. This is determined by a device's plugin.
                        items:
                          type: string
                          default: _default
                        example:
                        - startup
                        - running
                    required:
                    - Schedule
                ManualConfigTypes:
                  type: array
                  default:
                  - _default
                  description: 'List of configuration types that will be backed up if a manual backup is triggered.

                    '
                  items:
                    type: string
                    default: _default
                  example:
                  - startup
                  - running
                BackupPrefix:
                  type: string
                  description: Prefix for backup filenames
                BackupStatus:
                  type: string
                  readOnly: true
                  description: Status for the last device backup
                  enum:
                  - OK
                  - Failed
                Address:
                  type: string
                  description: Network address of the device. Supports IPv4, IPv6 and Hostnames
                  example:
                  - 127.0.0.1
                  - ::1
                  - skylarcompliance.com
                AgentID:
                  type: integer
                  description: 'ID of an [Agent](#tag/Agent) this device should communicate through. The default `0` means that Skylar Compliance will

                    communicate with a device directly

                    '
                  default: 0
                AgentName:
                  type: string
                  description: Name of the [Agent](#tag/Agent) that a device uses (if set)
                  readOnly: true
                  example: An Agent
                Protocol:
                  type: string
                  description: Connection protocol to use. Check device's plugin for supported protocols
                  example: scp
                CredentialID:
                  type: integer
                  description: 'ID of the [Credential](#tag/Credential) assigned to this device. Credentials take precedence over any username or

                    password set for the device

                    '
                  default: 0
                  example: 123
                FailurePolicy:
                  type: object
                  description: 'What should Skylar Compliance to when a device encounters an error taking backups.

                    Please note: Inherits defaults from the [Settings/Device](#tag/SettingsDevice) endpoint.

                    '
                  properties:
                    Retries:
                      type: integer
                      minimum: -1
                      maximum: 6
                      description: 'Sets the retry policy. When `PluginKey` is `push_device`, it holds the interval between each retry, in hours.

                        If not, it holds the number of attempts. Special values are `0` (Always), which only applies when

                        `PluginKey` is not `push_device` and `-1` (Never)

                        '
                      example: 0
                      default: 0
                    Action:
                      type: string
                      description: 'Which action to take once the maximum amount of attempts have failed. This will either `Revert` to schedule,

                        set the device to `Manual` backups or `Disable` the device. Only applies to devices which `PluginKey` is not `push_device`

                        '
                      default: Revert
                      enum:
                      - Revert
                      - Manual
                      - Disable
                      example: Disable
                    Alerts:
                      type: integer
                      description: Number of attempts needed to trigger an alert. `0` means Always, `-1` Never
                      example: 0
                      default: 0
                    RetryInterval:
                      type: integer
                      description: Time to wait before attempting a retry in minutes. Only applies to devices which `PluginKey` is not `push_device`
                      example: 15
                      default: 45
                UseAutoApply:
                  type: boolean
                  writeOnly: true
                  description: 'If a compliance policy''s auto apply rule matches and this flag is set to `true`, then those rules will be

                    automatically applied _only_ on device creation.

                    '
                  default: false
                  example: true
                PolicyIDs:
                  type: array
                  description: 'A list of [Compliance policies](#tag/Policy) to apply to this device.

                    **Please note:** if `UseAutoApply` is set to true on device creation, `PolicyIDs` is set automatically with any

                    policies that match and _any_ provided values are ignored.

                    '
                  items:
                    type: integer
                    example: 123
                  default: []
                  example:
                  - 1
                  - 2
                  - 3
                CurrentPolicyViolations:
                  type: array
                  description: 'A list of [Compliancy policy](#tag/Policy) violations for the last backup this device has.

                    '
                  readOnly: true
                  items:
                    $ref: '#/paths/~1devices/post/requestBody/content/application~1json/schema/properties/PastPolicyViolations/items'
                PastPolicyViolations:
                  type: array
                  description: 'A list of [Compliancy policy](#tag/Policy) violations for all backups except the last one this device has.

                    '
                  readOnly: true
                  items:
                    title: Policy violation
                    description: Policy violation model
                    type: object
                    properties:
                      Date:
                        type: string
                        description: Timestamp for when the underlying backup file was last seen.
                        example: '2021-01-18T23:59:59.999Z'
                      BackupVersion:
                        type: integer
                        description: Version of the device configuration that is in violation.
                        example: 123
                      BackupID:
                        type: integer
                        description: Backup identifier for the configuration that is in violation.
                        example: 123
                      ConfigType:
                        type: string
                        description: Configuration type that is in violation.
                        example: running
                      CommandName:
                        type: string
                        description: Name of the runtime command associated with the violation.
                        example: Show version
                      ContextConfigType:
                        type: string
                        description: Parent configuration type for context backup violations.
                        example: running
                      PolicyName:
                        type: string
                        description: Name of the policy that was violated.
                        example: IOS - Enable Secret Is Set
                      PolicyID:
                        type: integer
                        description: ID of the policy that was violated.
                        example: 321
                      RuleName:
                        type: string
                        description: Name of the specific rule in the policy that was violated.
                        example: Version
                      RuleID:
                        type: integer
                        description: ID of the policy rule that was violated.
                        example: 456
                      RuleSeverity:
                        type: string
                        description: Severity level of the policy rule.
                        example: High
                      RuleTimestamp:
                        type: string
                        description: Timestamp for when the rule test has been performed.
                        example: '2021-01-18T23:59:59.999Z'
                      Details:
                        type: string
                        description: Violation details, including a list of files and reasons.
                        example: 'files: tmp/foo.txt, tmp/bar.txt

                          reasons: tmp/foo.txt: 7 | match me, tmp/bar.txt: 3 | don''t match me'
                      Remediation:
                        type: string
                        description: Any manual remediation steps that are reqiured to resolve the violation.
                        example: Update device to version >= 6.0
                UsePublicKeyAuthentication:
                  type: boolean
                  default: false
                  description: 'Use public key for authenticating device connections over SSH. See [Settings/PublicKey](#tag/SettingsPublicKey)

                    how to retrieve those for your appliance.

                    '
                DisableStrictHostKeyChecking:
                  type: boolean
                  default: false
                  description: Disables the ssh host key validation when performing ssh connections. Logs whether or not the key has changed.
                BackupInterval:
                  type: string
                  description: 'Human readable string of the current backup interval for a device if a schedule is set. Defaults to `Manual`

                    unless it''s a Generic Push Device where it will default to `N/A`.

                    '
                  default: Manual
                  readOnly: true
                  example: Every 15th minute past every hour
                LastBackupAttempt:
                  type: string
                  description: 'Timestamp of last attempted backup.

                    '
                  example: '2021-01-18T23:59:59.999Z'
                  readOnly: true
                LastSuccessfulBackup:
                  type: string
                  description: 'Timestamp of last completed backup.

                    '
                  example: '2021-01-16T23:59:59.999Z'
                  readOnly: true
                NextBackup:
                  type: string
                  description: 'Timestamp of next scheduled backup.

                    '
                  example: '2021-01-20T23:59:59.999Z'
                  readOnly: true
                Baseline:
                  type: boolean
                  description: Whether the current backup is an approved configuration.
                  example: true
                  readOnly: true
                State:
                  type: string
                  description: Current state of the device.
                  example: Processing
                  readOnly: true
                Status:
                  type: string
                  description: Current status indicator.
                  example: InProgress
                  readOnly: true
                  enum:
                  - Error
                  - Disabled
                  - InProgress
                  - OK
                ComplianceScore:
                  type: integer
                  description: 'The percentage compliance score of the device. Omitted if no compliance

                    policies have been run against the device.

                    '
                  example: 69
                  readOnly: true
                ComplianceStatus:
                  type: string
                  description: 'The compliance status of the device based on compliance score. Passed if 100,

                    Failed if between 0 and 100 and N/A if -1

                    policies have been run against the device.

                    '
                  example: Failed
                  readOnly: true
                  enum:
                  - Passed
                  - Failed
                  - N/A
                Up:
                  type: boolean
                  description: 'Whether or not a device is up. Omitted if no monitors are set for this device.

                    '
                  example: true
                Uptime:
                  type: number
                  description: 'Percentage of time the device has been monitored as up. `-1` means Not Monitored.

                    '
                  example: 100
                  readOnly: true
                BackupSize:
                  type: integer
                  description: Size of all backups for this device on disk in bytes.
                  example: 123456
                  readOnly: true
                SetupComplete:
                  type: boolean
                  description: Whether or not a device setup is completed. A completed device setup includes enough information to take a backup.
                  example: true
                  readOnly: true
                Model:
                  type: string
                  description: Device's model.
                  example: WS-C2950-24
                  readOnly: true
                LastSuccessfulBackupID:
                  type: integer
                  description: ID of the last successful backup
                  example: 123456
                  readOnly: true
              required:
              - Name
              - PluginKey
              - PluginFields
              - Address
              - Protocol
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/paths/~1devices/post/requestBody/content/application~1json/schema'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/paths/~1jobs/get/responses/401/content/application~1json/schema'
              example:
                message: Input validation failed
                errors:
                  Name:
                  - Must not be blank
                  DomainID:
                  - Domain with ID 123 does not exist
                  - Can only be set on device creation
                  LabelIDs[0]:
                  - Label with ID 123 does not exist
                  Monitor:
                  - Must be set
                  Monitor.AlertFail:
                  - Must be a positive number
                  AssetFields[0].ID:
                  - Must be set
                  - Assetfield ID 123 does not exist
                  AssetFields[0].Value:
                  - Must be set
                  PluginKey:
                  - Must not be blank
                  - Plugin 'foo' does not exist
                  NotificationEmails[0]:
                  - Is not a valid email address
                  BackupSchedules[0].Schedule:
                  - Must be set
                  - Is not a valid Skylar Compliance schedule expression
                  BackupSchedules[0].ConfigTypes[0]:
                  - Must not be blank
                  - Config type 'bar' is not valid for plugin 'foo'
                  ManualConfigTypes[0]:
                  - Must not be blank
                  - Config type 'bar' is not valid for plugin 'foo'
                  Address:
                  - Must not be blank (except for Push Devices)
                  - Must be a valid IP address
                  AgentID:
                  - Agent with ID 123 does not exist
                  Protocol:
                  - Must not be blank (except for Push Devices)
                  CredentialID:
                  - Credential set with ID 123 does not exist
                  FailurePolicy.Retries:
                  - Must be either a positive integer lesser then 168 or -1 since `PluginKey` is `push_device`
                  - Must be an integer between -1 and 6 since `PluginKey` is not `push_device`
                  FailurePolicy.Action:
                  - Has to be one of 'Revert', 'Manual' or 'Disable'
                  FailurePolicy.Alerts:
                  - Must be an integer between 0 and 3 since `PluginKey` is `push_device`
                  - Must be either -1, 0, 1 or `FailurePolicy.Retries+1` since `PluginKey` is not `push_device`
                  FailurePolicy.RetryInterval:
                  - Must be a positive number
                  UseAutoApply:
                  - Can only be set on device creation
                  PolicyIDs[0]:
                  - Policy with ID 123 does not exist
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/paths/~1jobs/get/responses/401/content/application~1json/schema'
              examples:
                Global:
                  value:
                    message: Maximum number of devices reached
                Domain:
                  value:
                    message: Maximum number of devices in domain reached
      parameters: []
    patch:
      summary: Patch multiple devices
      tags:
      - Device
      security:
      - Cookie: []
      - Token: []
      - Permissions:
        - ModifyDevice
      operationId: patch_devices
      description: Patches multiple devices at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Devices Patch Request Body
              type: object
              description: Devices patch request body model
              properties:
                DeviceIDs:
                  description: Device IDs
                  type: array
                  items:
                    type: integer
                    example: 123
                Disabled:
                  description: Device disabled
                  type: boolean
                  example: true
                AgentID:
                  type: integer
                  description: 'ID of the [Agent](#tag/Agent) that should manage the given devices.

                    The devices need to be in the agent''s domain, otherwise the request will fail.

                    '
                  default: 0
                  example: 123
                CredentialID:
                  type: integer
                  description: 'ID of the [Credential](#tag/Credential) that should be applied to the given devices.

                    The devices need to be in the credential''s domain, otherwise the request will fail.

                    '
                  example: 123
                PolicyIDs:
                  type: array
                  items:
                    type: integer
                    example: 123
                  description: 'List of [Policy](#tag/Policy) IDs that should be applied to the given devices.

                    The policies need to be in each of the devices'' domains, otherwise the request will fail.

                    '
                  example: 123
                NotPolicyIDs:
                  type: array
                  items:
                    type: integer
                    example: 123
                  description: 'List of [Policy](#tag/Policy) IDs that should not be applied to the given devices.

                    The policies need to be in each of the devices'' domains, otherwise the request will fail.

                    '
                  example: 123
                ReplacePolicies:
                  type: boolean
                  description: 'If true, replaces all existing policies with the new ones provided in the request.

                    If false, adds the new policies to the existing ones.

                    '
                PluginKey:
                  type: string
                  description: 'Key of [Plugin](#tag/Plugin) used for all devices

                    '
                DomainID:
                  type: integer
                  description: 'ID of the [Domain](#tag/Domain) where the devices should be located.

                    '
                LabelIDs:
                  type: array
                  items:
                    type: integer
                    example: 123
                  description: 'List of [Label](#tag/Label) IDs that should be applied to the given devices.

                    '
                ReplaceLabels:
                  type: boolean
                  description: 'If true, replaces all existing labels with the new ones provided in the request.

                    If false, adds the new labels to the existing ones.

                    '
                DisabledUntil:
                  type: string
                  description: 'Timestamp of when to re-enable devices if they are disabled. Pass an empty string `""` to disable

                    a device forever.

                    '
                  example: '2021-01-18T23:59:59.999Z'
                DisabledReason:
                  type: string
                  description: 'Reason for disabling devices if they are disabled.

                    Only applicable if `DisabledUntil` is not empty.

                    '
                BackupPrefix:
                  type: string
                  description: 'Prefix for backup files created by the devices.

                    '
                NotificationEmails:
                  type: array
                  items:
                    type: string
                    example: example@example.com
                  description: 'List of email addresses to receive notifications for the devices.

                    '
                ReplaceNotificationEmails:
                  type: boolean
                  description: 'If true, replaces all existing notification emails with the new ones provided in the request.

                    '
                Notifications:
                  type: object
                  properties:
                    OnConfigChange:
                      type: boolean
                      description: 'Send notification if a configuration change has been detected (compares current with previous backup)

                        `false` - Off, `true` - On

                        '
                    OnBackupStart:
                      type: boolean
                      description: Notify when a scheduled backup starts, `false` - Off, `true` - On
                    OnBackupEnd:
                      type: boolean
                      description: Notify when a scheduled backup finishes, `false` - Off, `true` - On
                Monitor:
                  type: object
                  properties:
                    Enabled:
                      type: boolean
                      description: "Denotes if monitoring is enabled/disabled or a mix for the given list of devices. Pass `true` to enable\nmonitoring for all devices and `false` to disable monitoring \n"
                    AlertFail:
                      type: integer
                      description: 'Regard as down after this many failures. Must be greater than `0` when `Monitor.Enabled` is `true`.

                        '
                      example: 2
                    IsPing:
                      type: boolean
                      description: Perform ICMP ping rather than TCP connect, `false` - Off, `true` - On
                    AlertEmail:
                      type: boolean
                      description: Send alert email to owner after AlertFail failures, `false` - Off, `true` - On
                    AlertEmailUp:
                      type: boolean
                      description: Send alert email to owner when device is back up, `false` - Off, `true` - On
                Protocol:
                  type: string
                  description: 'Protocol of devices.

                    '
                  example: SSH
                BackupSchedules:
                  type: array
                  items:
                    type: object
                    properties:
                      Schedule:
                        type: string
                        description: A [cron-like expression](#section/Schedules)
                        example: 15 * * * *
                      RetainVersions:
                        type: integer
                        description: How many different versions of backups to keep
                        example: 5
                      RetainDays:
                        type: integer
                        description: How many days to retain backups
                        example: 5
                      DeleteDays:
                        type: integer
                        description: How many days until backups are deleted.
                        example: 5
                ReplaceBackupSchedules:
                  type: boolean
                  description: 'If true, replaces all existing backup schedules with the new ones provided in the request.

                    If false, adds the new backup schedules to the existing ones.

                    '
                FailurePolicy:
                  type: object
                  description: 'What should Skylar Compliance do when a device encounters an error taking backups.

                    '
                  properties:
                    Retries:
                      type: integer
                      minimum: -1
                      maximum: 6
                      description: "Sets the retry policy. When `PluginKey` is `push_device`, it holds the interval between each retry, in hours. \nIf not, it holds the number of attempts. Special values are `0` (Always), which only applies when `PluginKey`\nis not `push_device` and `-2` (Never)\n"
                      example: 0
                    Action:
                      type: string
                      description: 'Which action to take once the maximum amount of attempts have failed. This will either `Revert` to schedule,

                        set a device to `Manual` backups or `Disable` a device. Only applies to devices which `PluginKey` is not `push_device`

                        '
                      default: Revert
                      enum:
                      - '[Multiple]'
                      - Revert
                      - Manual
                      - Disable
                      example: Disable
                    Alerts:
                      type: integer
                      description: Number of attempts needed to trigger an alert. `0` means Always and `-2` Never
                      example: 0
                    RetryInterval:
                      type: integer
                      description: Time to wait before attempting a retry in minutes. Only applies to devices which `PluginKey` is not `push_device`
                      example: 15
                AssetFields:
                  type: array
                  description: 'List of [Assetfields](#tag/SettingsAssetField) with device specific data

                    '
                  items:
                    type: object
                    properties:
                      ID:
                        type: integer
                        description: Internal [Assetfield](#tag/SettingsAssetField) ID
                        example: 123
                      Value:
                        type: string
                        description: Asset field value
                        example: Example Location
                InfoCommandIDs:
                  type: array
                  description: 'List of [InfoCommand](#tag/InfoCommand) IDs to execute on the devices

                    '
                  items:
                    type: integer
                    example: 123
                ReplaceInfoCommandIDs:
                  type: boolean
                  description: 'If true, replaces all existing info command IDs with the new ones provided in the request.

                    If false, adds the new info command IDs to the existing ones.

                    '
                ManualConfigTypes:
                  type: array
                  description: "List of config types to be backed up by the given devices. \nRequires `PluginKey` to be filled.\n"
                  items:
                    type: string
                  example:
                  - ssh
                  - apache
                PluginFields:
                  type: object
                  description: 'Plugin-specific fields as key-value pairs. The available fields depend on the selected plugin.

                    Common fields include `username`, `password`, `backup_port`, etc.

                    Requires `PluginKey` to be filled.

                    '
                  additionalProperties:
                    type: string
                  example:
                    username: admin
                    password: secret123
                    enable: enable_pass
                    backup_port: '22'
              required:
              - DeviceIDs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Patch device response
                properties:
                  UpdatedCount:
                    description: Total updated devices
                    type: integer
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/paths/~1jobs/get/responses/401/content/application~1json/schema'
              example:
                message: Input validation failed
                errors:
                  DeviceIDs:
                  - Must not be empty
                  NotPolicyIDs:
                  - Must not be empty
                  DisabledUntil:
                  - Must be set if DisabledReason is set
                  Monitor.AlertFail:
                  - Must be a positive number
                  PluginKey:
                  - Must be set if Protocol is set
                  - Must be set if PluginFields is set
                  - Must be set if ManualConfigTypes is set
                  - Plugin 'foo' does not exist
                  Protocol:
                  - Must not be blank (except for Push Devices)
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/paths/~1jobs/get/responses/401/content/application~1json/schema'
              examples:
                NoPatchField:
                  value:
                    message: No changes were provided on the request body
                    errors:
                      PatchDevices:
                      - no fields provided for patch
                DomainValidation:
                  value:
                    message: Domain validation failed
                    errors:
                      AgentID:
                      - Incompatible agent. You must replace the agent to complete the domain change.
                      LabelIDs:
                      - Incompatible labels. You must replace all labels to complete the domain change.
                      CredentialID:
                      - Incompatible credentials. You must replace the credentials to complete the domain change.
                      PolicyIDs:
                      - Incompatible policies. You must replace all policies to complete the domain change.
                      InfoCommandIDs:
                      - Incompatible info commands. You must replace all info commands to complete the domain change.
  /devices/{id}:
