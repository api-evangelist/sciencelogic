  /devices/test:
    post:
      summary: Test device login
      tags:
      - Device
      security:
      - Cookie: []
      - Token: []
      - Permissions:
        - AddDevice
      operationId: test_device
      description: Test device connection and login details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: TestDeviceRequest
              type: object
              description: Test device login parameters
              properties:
                DomainID:
                  type: integer
                  description: ID of the [Domain](#tag/Domain) a device belongs to (if any). Only allowed to be set during device creation.
                  default: 0
                  example: 123
                PluginKey:
                  type: string
                  description: A [Plugin](#tag/Plugin) identifier (`key`) that sets the plugin a device uses
                  example: cisco_ios
                PluginFields:
                  type: array
                  description: 'List of additional fields for a device, determined by the device plugin. Common field names are `username`,

                    `password`, `password2`, `backup_port`, `nat_bc`.

                    '
                  items:
                    type: object
                    properties:
                      Name:
                        type: string
                        description: Name of plugin field
                        example: username
                      Value:
                        type: string
                        description: Value of plugin field
                        example: afox
                    required:
                    - Name
                Address:
                  type: string
                  description: Network address of the device
                  example: 127.0.0.1
                AgentID:
                  type: integer
                  description: 'ID of an [Agent](#tag/Agent) this device should communicate through. The default `0` means that Skylar Compliance will

                    communicate with a device directly

                    '
                  default: 0
                Protocol:
                  type: string
                  description: Connection protocol to use. Check device's plugin for supported protocols
                  example: scp
                CredentialID:
                  type: integer
                  description: 'ID of the [Credential](#tag/Credential) assigned to this device. Credentials take precedence over any username or

                    password set for the device

                    '
                  default: 0
                  example: 123
                UsePublicKeyAuthentication:
                  type: boolean
                  default: false
                  description: 'Use public key for authenticating device connections over SSH. See [Settings/PublicKey](#tag/SettingsPublicKey)

                    how to retrieve those for your appliance.

                    '
              required:
              - PluginKey
              - PluginFields
              - Address
              - Protocol
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  Device:
                    type: string
                    description: Name of the device
                    example: New Device
                  Result:
                    type: string
                    description: Result of the connection attempt
