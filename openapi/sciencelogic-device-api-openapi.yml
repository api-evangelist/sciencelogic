                    example2,Cisco ASA,127.0.0.1,ssh,afox@skylarcompliance.com,,N,5,,,,,Global,,N,N,22,Y,N,5,1,N,N,startup#running,N,N,id##,2,9.9(2)18,Cisco,ASAv

