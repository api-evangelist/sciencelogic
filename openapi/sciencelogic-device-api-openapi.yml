  /devices/search:
    post:
      summary: Global search
      tags:
      - Device
      security:
      - Cookie: []
      - Token: []
      - Permissions:
        - ViewBackup
      operationId: global_search
      description: Search across devices and configurations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Search:
                  type: string
                  description: Search term (case-insensitive)
                  example: interface
                SearchType:
                  type: string
                  description: Search type
                  enum:
                  - string
                  - regex
                  example: regex
                LimitAge:
                  type: integer
                  description: Restrict search to configuration not older that this many days. `0` means unlimited
                  default: 0
                  example: 1
                LimitVersions:
                  type: integer
                  description: Limit search to last X. `0` for unlimited. Defaults to last version.
                  default: 1
                  example: 0
                DeviceIDs:
                  type: array
                  description: Include configuration from the given [Device](#tag/Device) IDs
                  items:
                    type: integer
                  example:
                  - 123
                  - 124
                  - 125
                NextPagination:
                  title: Search Pagination
                  type: object
                  properties:
                    LastSeen:
                      type: string
                      description: The timestamp of the backup to be paged into
                      example: '2021-01-18T23:59:59.999Z'
                    BID:
                      type: integer
                      description: Backup ID of the backup to be paged into
                      example: 124
                    Filepath:
                      type: string
                      description: The file to be paged into within that backup
                      example: /foo/bar/config.txt
                    Offset:
                      type: integer
                      description: The byte offset within the file to be paged into
                      example: 123
                    FileLineOffsets:
                      type: object
                      additionalProperties:
                        type: integer
                      description: Map of file paths to their cumulative line offsets for tracking line numbers across pagination
                      example:
                        /foo/bar/config.txt: 150
                        /foo/bar/logs.txt: 75
                    Size:
                      type: integer
                      description: The number of matches per page
                      example: 50
              required:
              - Search
              - SearchType
              - DeviceIDs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Global search results
                    items:
                      type: object
                      properties:
                        DeviceID:
                          type: integer
                          description: The [Device](#tag/Device) ID
                          example: 123
                        DeviceName:
                          type: string
                          description: Name of the [Device](#tag/Device)
                          example: My First Cisco
                        DomainID:
                          type: integer
                          description: ID of the device's [Domain](#tag/Domain)
                          example: 123
                        DomainName:
                          type: string
                          description: Name of the device's [Domain](#tag/Domain)
                          example: Production
                        PluginName:
                          type: string
                          description: Name of device's plugin
                          example: Cisco IOS XE
                        Results:
                          type: array
                          description: Device search results
                          items:
                            type: object
                            properties:
                              BackupID:
                                type: integer
                                description: ID of the [configuration backup](#tag/DeviceBackup) a match was found
                                example: 123
                              ConfigName:
                                type: string
                                description: Name of the configuration
                                default: _default
                                example: running
                              Description:
                                type: string
                                description: Description of where a match was found
                                example: Version 68 - ucs var/tmp/tmsh_syntax/14.1.2/auto_schema_data_apm_cli.dat
                              File:
                                type: string
                                description: Filename of file with match
                                example: config/.diffVersions/config/BigDB.dat/BigDB.dat
                              InName:
                                type: boolean
                                description: Set to `true` if a match was found in the filename. This can only be true if SearchType is `string`
                                example: true
                              SearchResultsCount:
                                type: integer
                                description: Number of search results that are present in the file
                              MatchedLines:
                                type: array
                                description: Lines that matched the search term. It's only returned if SearchType is `regex`
                                items:
                                  type: object
                                  properties:
                                    Content:
                                      type: string
                                      description: The line of the match
                                      example: interface Ethernet1/1
                                    Number:
                                      type: integer
                                      description: The line number of the match
                                      example: 1234
                                    Match:
                                      type: string
                                      description: The part of the line that matched the search term
                                      example: interface
                                  required:
                                  - Content
                                  - Number
                                  - Match
                            required:
                            - BackupID
                            - ConfigName
                            - Description
                            - File
                            - InName
                            - SearchResultsCount
                      required:
                      - DeviceID
                      - DeviceName
                      - DomainID
                      - DomainName
                      - PluginName
                      - Results
                  next_pagination:
                    $ref: '#/paths/~1devices~1search/post/requestBody/content/application~1json/schema/properties/NextPagination'
                  truncated:
                    type: boolean
                    description: Set to `true` if the search timed out and only partial results are returned. Use `next_pagination` to continue the search.
      parameters: []
