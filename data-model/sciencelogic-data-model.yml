tenancy_note: >-
  DomainID is the single most widespread foreign key in the contract (19 distinct occurrences across
  request and response bodies). An agent operating this API must treat domain scope as the primary reason a
  resource is invisible — a 404 on a valid id is frequently a domain-scoping outcome, not a missing record.
