rest_only_summary: >-
  297 of the 314 Skylar Compliance operations have no MCP tool. The server exposes a read-only slice:
  every destructive or state-changing operation in the contract — restore_backup, delete_device,
  cancel_job, push_firmware, credential and user management, all of /settings/** — is deliberately
  unmapped. Whole tag groups with no tool at all include Command, Credential, Discovery, Firmware,
  Template, Token, User, Role, Schedule, Export, Network, Syslog, Transcript and every Settings/* tag.
