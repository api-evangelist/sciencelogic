  announced_deprecations:
    - subject: Skylar One (SL1) REST API
      status: maintenance-only, superseded by the GraphQL API
      statement: >-
        "Support for the REST API will continue after 8.14.0, However support will be limited to bug fixes
        and ensuring the API continues to provide visibility to data residing in the relational data store
        (MariaDB). Performance and log data stored in a NoSQL store (the Storage Node cluster) will not be
        visible via the ScienceLogic REST API."
      migration_target: SL1 GraphQL API
      migration_statement: >-
        "Customers planning to upgrade to a version of Skylar One that stores data in a NoSQL store or a
        graph database should plan to update any integrations to use the GraphQL API instead."
      source: https://docs.sciencelogic.com/skylar_one/latest/Content/Manuals/Architecture/architecture_if_layer_apis.htm
      sunset_date: null
    - subject: Skylar Compliance old UI reports (Information > Reports > Old UI Reports)
      status: deprecation announced, no date
      statement: >-
        "Old user interface reports (Information > Reports > Old UI Reports) will be deprecated in upcoming
        releases. To prevent any data loss, you should migrate any old reports to the new reports."
      source: https://docs.sciencelogic.com/skylar_compliance/latest/Content/Release_Notes/Skylar_Compliance_MR/skylar_compliance_release_notes_2026.htm
      sunset_date: null
    - subject: Python 2 support in Skylar One custom code
      status: removed in 12.5.1
      statement: >-
        "All Python 2 functionality was removed from Skylar One with the 12.5.1 release. If you still use
