- aid: sciencelogic:sciencelogic-command-api
  name: ScienceLogic Command API
  description: >-
    Skylar Compliance allows you to send a CLI command to a device or group of devices and capture the
    output of the

    command. This is a very convenient tool to perform a task concurrently on a group of devices, such
    as changing

    the administrator password.


    ### Using variables


    Commands can be parameterised for different devices, using the format `$parameter$`, where `$` is
    the Variable

    Delimiter you've set for your Command. For instance, to change the admin password for a number of
    ScreenOS

    devices, select the devices and enter the command:


    ```

    set admin password $password$

    ```


    When running a parameterised command against devices, you have to pass a replacement value for each
    device.


    **Note:** A parameter can only consist of letters, numbers, and the underscore character `_`. If the
    replacement

    string contains escape sequences (such as `\n`), they must be double-escaped (`\\n`).


    ### Lua Functions Inputs


    Lua Functions commands support parameterized inputs that are passed to the function. Each input can
    have:

    - **Source: text** - Hardcoded value when creating the command

    - **Source: prompt** - User is prompted to enter value when running the command

    - **Source: csv** - Values are imported from a CSV file


    Inputs can be marked as `Secret` to hide values in outputs and transcripts.
  humanURL: https://sciencelogic.com
  baseURL: https://{appliance}/api/v2
  tags:
  - Command
  properties:
  - type: OpenAPI
    url: openapi/sciencelogic-command-api-openapi.yml
  - type: APIReference
