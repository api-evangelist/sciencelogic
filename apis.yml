- aid: sciencelogic:sciencelogic-user-api
  name: ScienceLogic User API
  description: >-
    Skylar Compliance supports three levels of user access:


    - **Admin:** Super User; has full control (can create/modify/delete devices and users, initiate backups/restores
      and change the appliance configuration). Admins also have an encryption password that allows Skylar
    Compliance to
      transition from the locked state to the normal state.
    - **Backup:** Backup Operator; can perform device backups and restores, but cannot modify devices,
    users, or
      appliance settings.
    - **View Only:** Monitor Operator; can only view existing backups, access logs, and verify that the
    system is
      operating normally.

    **Please note:** Administrators authenticating using RADIUS, LDAP or SAML cannot decrypt the system
    after a reboot.
  humanURL: https://sciencelogic.com
  baseURL: https://{appliance}/api/v2
  tags:
  - User
  properties:
  - type: OpenAPI
