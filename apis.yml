- aid: sciencelogic:sciencelogic-settings-network-api
  name: ScienceLogic Settings/Network API
  description: >-
    Allows you to set network settings such as the IP address and static routes.


    ### Network Address Translation (NAT)


    Skylar Compliance may use back-connections (typically TFTP or FTP) to backup certain devices. If Skylar
    Compliance is

    accessing a device using back connections through a NAT router or firewall, back-connections will
    fail, because

    the device will attempt to connect to the original, untranslated IP address. To avoid this problem,
    proceed as

    follows:


    * On your firewall, create a 1:1 NAT mapping (often referred to as Static NAT or Mapped IP) to translate
    the IP
      address of Skylar Compliance to a public/routable IP address
    * Set the public IP address for Skylar Compliance in the `NatAddress` field. The system-wide NAT IP
    address defined
      here can be overridden in the Domain settings, or in each individual device's settings
    * The Back-connection NAT option also needs to be selected in any device which is accessed by Skylar
    Compliance through
      NAT

    Skylar Compliance supports multiple NAT addresses; the NAT IP address defined in this page can be
    overridden by the

    Domain or Device NAT IP setting.


    ### Please note


    Changing the IP address to a different one will result in aborted connections.
  humanURL: https://sciencelogic.com
  baseURL: https://{appliance}/api/v2
  tags:
  - Settings/Network
  properties:
  - type: OpenAPI
    url: openapi/sciencelogic-settings-network-api-openapi.yml
  - type: APIReference
    url: https://docs.sciencelogic.com/skylar_compliance/api/5-6/api.html
  - type: ErrorCatalog
