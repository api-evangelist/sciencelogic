- aid: sciencelogic:sciencelogic-device-bulkedit-api
  name: ScienceLogic Device/Bulk Edit API
  description: >-
    Allows editing multiple devices at once. This losely follows the structure of the [Device](#tag/Device)
    model.


    Skylar Compliance will aggregate values for individual settings.


    **String** values that are not the same across all selected devices will be returned as `[Multiple]`.
    You can

    either override all values by setting a different value or leave unchanged by passing back `[Multiple]`.


    **Boolean** values on the [Device](#tag/Device) model will have their equivalent field as integers,
    with `-1`

    meaning multiple values, `0` for `false` and `1` for `true`. Either set a new value for a field or
    pass back `-1`

    to leave it unchanged.


    **Integers** will use `-1` to denote multiple values. Either set a new value for a field or pass back
    `-1` to

    leave it unchanged.


    Please note that not all fields of the [Device](#tag/Device) model can be edited this way.
  humanURL: https://sciencelogic.com
  baseURL: https://{appliance}/api/v2
  tags:
  - Device/BulkEdit
