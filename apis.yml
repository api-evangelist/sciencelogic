- aid: sciencelogic:skylar-one-rest-api
  name: Skylar One REST API
  description: >-
    The REST API for Skylar One (formerly SL1), giving external systems programmatic access to tickets,
    devices, organizations, events, monitoring policies, dynamic applications, schedules, thresholds and
    collected data. Requests carry SL1 login credentials over HTTPS and select application/json or application/xml
    with an Accept header. ScienceLogic has placed it in maintenance: support after 8.14.0 is limited
    to bug fixes, it cannot see data held in the NoSQL storage-node cluster, and customers are directed
    to the GraphQL API for new integrations. No machine-readable contract is published for it.
  humanURL: >-
    https://docs.sciencelogic.com/latest/Content/Web_Content_Dev_and_Integration/ScienceLogic_API/api_intro.htm
