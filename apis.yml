aid: sciencelogic
name: ScienceLogic
description: >-
  ScienceLogic is an AIOps and IT operations company whose ScienceLogic AI Platform — rebranded in 2026 as
  the Skylar family — covers infrastructure and application observability, network configuration and
  compliance, and workflow automation. Skylar One (formerly SL1) is the observability platform, with a
  REST API and a GraphQL API served from the customer's own Administration Portal, All-In-One Appliance or
  Database Server; ScienceLogic states that GraphQL is the forward path and that the REST API is now
  limited to bug fixes. Skylar Compliance (formerly Restorepoint, acquired by ScienceLogic) publishes a
  314-operation OpenAPI 3.0 contract for configuration backup, change detection, compliance policy testing
  and device restore. Skylar Automation (formerly PowerFlow) handles ITSM and CMDB integration, and Skylar
  AI adds Advisor and Analytics on top. The ScienceLogic GitHub organization also publishes an MCP server
  that exposes read-only Skylar One and Skylar Compliance tools to AI agents. Products are deployed on
  customer appliances, SaaS, or private/public cloud, and are licensed per managed device per month.
