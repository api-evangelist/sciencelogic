- aid: sciencelogic:sciencelogic-agent-api
  name: ScienceLogic Agent API
  description: >-
    Agents allow a Skylar Compliance appliance to manage devices located on a remote or otherwise disjointed
    network, not

    directly routable by Skylar Compliance, without the need of complex firewall changes, Network Address
    Translation, or

    VPNs. For instance, a Service Provider can set up a central Skylar Compliance appliance and deploy
    agents on customer

    networks, enabling backups of devices on remote sites.


    An Agent can be deployed as a Virtual or Hardware appliance on the remote network; the Agent provides
    faster

    operations by locally performing all the tasks that would typically require extensive network interaction.

    Configurations, logs, etc. are processed locally by the agent, and uploaded to the master Skylar Compliance
    appliance.


    **Please note:** Agents are only available with an Enterprise licence.
  humanURL: https://sciencelogic.com
  baseURL: https://{appliance}/api/v2
  tags:
  - Agent
