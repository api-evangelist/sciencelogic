apis:
  - aid: sciencelogic:sciencelogic
    name: ScienceLogic
    description: >-
      The ScienceLogic AI Platform (Skylar) — AIOps, IT infrastructure and application observability,
      service management, network configuration compliance, and automated remediation.
    humanURL: https://sciencelogic.com
    tags:
      - AIOps
      - Observability
    properties:
      - type: Documentation
        url: https://docs.sciencelogic.com
  - aid: sciencelogic:skylar-compliance-api
    name: Skylar Compliance API
    description: >-
      The REST API for Skylar Compliance (formerly Restorepoint) — ScienceLogic's network configuration
      and change management product. 314 operations across 193 paths covering devices, configuration
      backups, backup diffing and restore, compliance policies and rules, discovery, credentials, firmware
      and template push, agents, jobs, users, roles and appliance settings. ScienceLogic states that the
      product's own web interface uses this same API for every operation. The API is served by the
      customer's own Skylar Compliance appliance at /api/v2.
    humanURL: https://docs.sciencelogic.com/skylar_compliance/api/5-6/api.html
    baseURL: https://{appliance}/api/v2
    tags:
      - Compliance
      - Network Configuration Management
      - Backup
    properties:
      - type: OpenAPI
        url: openapi/sciencelogic-skylar-compliance-openapi.json
      - type: APIReference
        url: https://docs.sciencelogic.com/skylar_compliance/api/5-6/api.html
      - type: Overlay
        url: overlays/sciencelogic-skylar-compliance-overlay.yaml
      - type: ErrorCatalog
        url: errors/sciencelogic-problem-types.yml
      - type: DataModel
        url: data-model/sciencelogic-data-model.yml
      - type: Documentation
        url: https://docs.sciencelogic.com/skylar_compliance/
  - aid: sciencelogic:skylar-one-graphql-api
    name: Skylar One GraphQL API
    description: >-
      The GraphQL API for Skylar One (formerly SL1). ScienceLogic's forward-looking interface — the default
      AP2 user interface uses it exclusively and makes no REST calls, and performance and log data held in
      the NoSQL storage-node cluster is visible only through it. It uses the same authentication profiles
      and credentials as the platform, and is served from the Administration Portal, All-In-One Appliance
      or Database Server. SL1 12.3.0 and later ship a built-in GQL Browser at System > Tools > GQL Browser.
      No published SDL or introspection endpoint is reachable from outside a customer deployment.
    humanURL: https://docs.sciencelogic.com/latest/Content/Web_Content_Dev_and_Integration/GraphQL_API/graphql_introduction.htm
    baseURL: https://{appliance}/gql
    tags:
      - GraphQL
      - Observability
    properties:
      - type: Documentation
        url: https://docs.sciencelogic.com/latest/Content/Web_Content_Dev_and_Integration/GraphQL_API/graphql_title_page_web.htm
      - type: GettingStarted
        url: https://docs.sciencelogic.com/latest/Content/Web_Content_Dev_and_Integration/GraphQL_API/graphql_introduction.htm
  - aid: sciencelogic:skylar-one-rest-api
    name: Skylar One REST API
    description: >-
      The REST API for Skylar One (formerly SL1), giving external systems programmatic access to tickets,
      devices, organizations, events, monitoring policies, dynamic applications, schedules, thresholds and
      collected data. Requests carry SL1 login credentials over HTTPS and select application/json or
      application/xml with an Accept header. ScienceLogic has placed it in maintenance: support after
      8.14.0 is limited to bug fixes, it cannot see data held in the NoSQL storage-node cluster, and
      customers are directed to the GraphQL API for new integrations. No machine-readable contract is
      published for it.
    humanURL: https://docs.sciencelogic.com/latest/Content/Web_Content_Dev_and_Integration/ScienceLogic_API/api_intro.htm
    baseURL: https://{appliance}/api
    tags:
      - REST
      - Observability
    properties:
      - type: Documentation
        url: https://docs.sciencelogic.com/latest/Content/Web_Content_Dev_and_Integration/ScienceLogic_API/api_intro.htm
      - type: APIReference
        url: https://docs.sciencelogic.com/latest/Content/Web_Content_Dev_and_Integration/ScienceLogic_API/resources_and_uris.htm
      - type: Deprecation
        url: lifecycle/sciencelogic-lifecycle.yml
  - aid: sciencelogic:sciencelogic-mcp
    name: ScienceLogic MCP Server
    description: >-
      A FastMCP server published by the ScienceLogic GitHub organization exposing 22 read-only tools across
      two sub-servers — Skylar One (backed by the SL1 GraphQL API) and Skylar Compliance (backed by the
      Skylar Compliance REST API). Self-hosted from a container image next to the customer's own
      appliances; ScienceLogic operates no hosted MCP endpoint. The README states it is unauthenticated,
      for experimental use, and not an official ScienceLogic product.
    humanURL: https://github.com/ScienceLogic/mcp
    tags:
      - MCP
      - Agents
    properties:
      - type: MCPServer
        url: mcp/sciencelogic-mcp.yml
      - type: ToolCrosswalk
        url: mcp/sciencelogic-tool-crosswalk.yml
      - type: SourceCode
        url: https://github.com/ScienceLogic/mcp
