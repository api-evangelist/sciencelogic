- aid: sciencelogic:sciencelogic-settings-ha-api
  name: ScienceLogic Settings/HA API
  description: >-
    High Availability (HA) provides a way to minimise the effects of hardware failure, by configuring
    two Skylar Compliance

    appliances in a cluster.


    Under normal operating conditions, the primary cluster member is active and the secondary is in standby
    mode; the

    active appliance performs all network operations, and replicates all settings and device configurations
    to the

    standby appliance. Skylar Compliance replicates data both incrementally (for instance, just after
    a backup is retrieved

    from a device) and by performing full synchronisations on a regular basis.


    Should the primary member become unavailable because of hardware failure, other network problem, or
    losing power,

    the secondary member will automatically become Active, and carry on as normal. If the primary recovers,
    it will

    automatically take over from the secondary and become active.


    HA does not require the appliance to be installed on the same network, as long as the traffic requirements
    are

    met (see below).


    Software updates and upgrades are managed at the cluster level; updating the active appliance will
    automatically

    update the standby appliance.


    ### Requirements


    * High Availability is a separately licensed feature.

    * Only appliances of the same model can be clustered; appliance must be running the same software
    version.

    * Cluster members must be able to communicate over HTTPS to exchange heartbeat information and data
      synchronisation; TCP/443 traffic should be permitted bidirectionally between the appliances.
  humanURL: https://sciencelogic.com
  baseURL: https://{appliance}/api/v2
  tags:
  - Settings/HA
  properties:
  - type: OpenAPI
    url: openapi/sciencelogic-settings-ha-api-openapi.yml
  - type: APIReference
    url: https://docs.sciencelogic.com/skylar_compliance/api/5-6/api.html
  - type: ErrorCatalog
    url: errors/sciencelogic-problem-types.yml
  - type: DataModel
    url: data-model/sciencelogic-data-model.yml
  - type: Documentation
    url: https://docs.sciencelogic.com/skylar_compliance/
