- aid: sciencelogic:sciencelogic-token-api
  name: ScienceLogic Token API
  description: >-
    Personal access tokens are used to authenticate requests to the API. Tokens are tied to the user that
    created

    them. All API operations undertaken via a personal access token are linked to the user account that
    created it

    and will be logged under that account's username.


    Tokens are passed as a `Authorization` header in each request:


    ```bash

    curl --header "Authorization: Custom <your_access_token>" "https://skylar-compliance.example.com/api/v2/tokens"

    ```
