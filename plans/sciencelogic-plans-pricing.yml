description: >-
  ScienceLogic publishes list pricing on its pricing page for the two metered products, Skylar One and
  Skylar Compliance. Pricing is per managed device per month, "From" prices only, with volume and
  device-group pricing quoted by sales. The Skylar AI products carry no published price. This file
  REPLACES a 2026-05-04 bulk-sweep scaffold whose free/paid tiers, request quotas and per-minute rate
  limits were invented defaults, not ScienceLogic's published plans.
billing_unit: >-
  A "node" or "managed device" — any resource that can be discovered and managed by the software and for
  which it collects fault, performance, configuration and other metrics. Includes physical, network
  addressable and virtual devices.
billing_model: >-
  Metered on usage, assessed periodically against average daily usage; overages above the licensed scope
  are invoiced in arrears at an agreed rate.
free_tier: false
