api_access_note: >-
  "SSO/SAML and API access" is listed as an included feature of both Skylar One Standard and Skylar
  Compliance Standard. There is no separate API plan, no per-call pricing and no published API quota — API
  access is a feature of the product licence, metered by managed device rather than by request.
