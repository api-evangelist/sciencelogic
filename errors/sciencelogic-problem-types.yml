format_note: 'The Skylar Compliance API does NOT use RFC 9457 application/problem+json. Every error is
  a plain application/json object using the spec''s own "Error" model: a human-readable `message`, an
  optional `errors` map of field name -> array of validation messages, and on some responses an `EncryptionStatus`
  enum (Encrypted | Decrypted | Decrypting | Failure) describing the appliance disk encryption state.
  There is no machine-readable error `type`, `code` or URI, so an agent must branch on the HTTP status
  and parse `message`/`errors` as text.'
envelope:
  content_type: application/json
  fields:
  - name: message
    type: string
    description: Human-readable error summary, e.g. "Input validation failed"
  - name: errors
    type: object
    description: Present on validation failures. Keys are request field names; values are arrays of messages.
  - name: EncryptionStatus
    type: string
    enum:
    - Encrypted
    - Decrypted
    - Decrypting
    - Failure
    description: Appliance decryption state; a decrypting appliance answers 503 until it finishes or fails.
